# This URL is also in DESCRIPTION, and the two must stay in sync. It was
# deliberately held out of DESCRIPTION until the site actually served: R CMD
# check --as-cran fetches every DESCRIPTION URL, so listing an unpublished
# site reports a 404 in the check that gates a release. GitHub Pages was
# enabled on the gh-pages branch on 2026-08-24 -- the pkgdown workflow had
# been deploying successfully since 2026-08-20, but nothing was serving what
# it pushed, so the site 404'd while every run stayed green. If the site ever
# stops answering, remove the URL from DESCRIPTION before the next release
# rather than letting --as-cran find it.
url: https://ehrlinger.github.io/hvtiRlifetables/

template:
  bootstrap: 5

# `docs/` in this repo is PROSE -- docs/specs/ and docs/plans/ are tracked
# design documents, not a generated site. pkgdown refuses to clean a directory
# it did not build ("'.../docs' is non-empty and not built by pkgdown"), so the
# site is built into pkgdown-site/ instead.
#
# ⚠️ This key alone is NOT enough. pkgdown::build_site_github_pages() takes
# dest_dir = "docs" as its default and OVERRIDES this setting, so the workflow
# must pass dest_dir explicitly and its deploy step must name the same folder.
destination: pkgdown-site

reference:
  - title: Reference survival
    contents:
      - us_matched
  - title: Vintages and fitted models
    contents:
      - us_lifetable_vintages
      - us_lifetable_model
      - us_lifetable_models
