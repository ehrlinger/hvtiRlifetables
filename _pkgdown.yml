# The site is not published yet, and there is no CI to publish it (see the
# TemporalHazard 1.2.0 blocker in README). Until it is live this url must NOT
# also be added to DESCRIPTION: R CMD check --as-cran fetches every
# DESCRIPTION URL and would report a 404, which is the check that actually
# gates a release. pkgdown::check_pkgdown() will abort with "URL is missing
# package url" until then -- accepted deliberately, developer-facing only.
# When the site goes live, add this URL to DESCRIPTION in the same commit.
url: https://ehrlinger.github.io/hvtiRlifetables/

template:
  bootstrap: 5

destination: pkgdown-site

reference:
  - title: Reference survival
    contents:
      - us_matched
  - title: Vintages and fitted models
    contents:
      - us_lifetable_vintages
      - us_lifetable_model
      - us_lifetable_models
